<div class="app" [attr.data-view]="view()">

  <!-- Encabezado principal -->
  <header class="topbar">

    <button
      type="button"
      class="brand"
      aria-label="Volver a la selección de modo"
      (click)="backToModes()"
    >

      <span class="brand-mark">#</span>

      <span class="brand-name">
        GRID/09
      </span>

    </button>

    <span class="tag">
      {{ modes[game.mode()].name }}
    </span>

  </header>

  <!-- Pantalla principal de selección -->
  @if (view() === 'select') {

    <main class="view view-select">

      <div class="layout">

        <section class="intro">

          <h1 class="hero-title">
            Tres
            <br />
            en línea
          </h1>

          <p class="hero-sub">
            Cuatro rivales. Nueve casillas.
            Una regla: alinea tres.
          </p>

        </section>

        <!-- Selector de las cuatro modalidades -->
        <app-mode-picker
          [mode]="game.mode()"
          (selectMode)="game.changeMode($event)"
        />

      </div>

      <div class="start-bar">

        <p class="start-mode">
          <span class="start-label">
            Modo
          </span>

          <strong>
            {{ modes[game.mode()].name }}
          </strong>
        </p>

        <button
          type="button"
          class="cta"
          (click)="startGame()"
        >
          Empezar

          <span class="cta-arrow" aria-hidden="true">
            ▶
          </span>

        </button>

      </div>

    </main>

  } @else {

    <!-- Tablero de juego -->
    <app-arena
      [board]="game.board()"
      [currentPlayer]="game.currentPlayer()"
      [mode]="game.mode()"
      [result]="game.result()"
      (move)="game.playMove($event)"
      (reset)="game.resetGame()"
      (back)="backToModes()"
    />

  }

  <!-- Pie de página -->
  <footer class="footer">

    <span>
      GRID/09 · ESPE
    </span>

    <span>
      Angular + TypeScript
    </span>

  </footer>

</div>
